name: Mobile editor web validation

on:
  push:
    branches:
      - experiment/mobile-touch-editor-20261027
  pull_request:
    paths:
      - 'src/editor/**'
      - 'index.html'
      - 'test/mobile-ui.test.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run web:build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rigby2D</title>
  </head>
  <body>
    <div id="app">
      <nav id="menubar"></nav>
      <main id="center">
        <canvas id="viewport"></canvas>
        <div id="viewbar"></div>
      </main>
      <div id="split-right" class="split-v"></div>
      <aside id="side">
        <section id="tree" class="panel"></section>
        <div id="split-tree" class="split-h"></div>
        <section id="properties" class="panel"><div class="content scroll"></div></section>
      </aside>
      <div id="split-bottom" class="split-h"></div>
      <section id="timeline">
        <div id="controls"></div>
        <div class="dopesheet-wrap">
          <div class="empty">No animation. Press ＋ New or Tab to start animating.</div>
          <div id="dopesheet"><canvas></canvas></div>
          <div id="graph" hidden><canvas></canvas></div>
        </div>
      </section>
      <footer id="status"><span id="status-text"></span><span id="status-info"></span></footer>
    </div>
    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>

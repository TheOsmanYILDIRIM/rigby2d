<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rigby2D Promo Studio</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1222;
        --panel: #121c33;
        --line: #263555;
        --text: #e6eefc;
        --weak: #8a9bbd;
        --accent: #5a8fd6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px 'Segoe UI',
          system-ui,
          sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      header,
      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      footer {
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 12px;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        background: #000;
        box-shadow: 0 10px 40px #0008;
      }
      button,
      select {
        background: #1b2847;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
      }
      input[type='range'] {
        flex: 1;
        min-width: 160px;
      }
      #status {
        color: var(--weak);
        margin-left: auto;
      }
      label {
        color: var(--weak);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Rigby2D Promo Studio</strong>
      <label
        >Cut
        <select id="cut"></select
      ></label>
      <button id="play">Play</button>
      <button id="frame">Save frame (PNG)</button>
      <button id="thumb">Save thumbnail</button>
      <label>Music <input id="music" type="file" accept="audio/*" /></label>
      <button id="render" class="primary">Render MP4</button>
      <span id="status">Loading…</span>
    </header>
    <main><canvas id="view"></canvas></main>
    <footer>
      <span id="time">0.00 s</span>
      <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" />
      <span id="scene"></span>
    </footer>
    <script type="module" src="./studio.js"></script>
  </body>
</html>
